<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f3ec"><title>Quản trị album — Ngày vui</title><style>:root{--ink:#342d2b;--muted:#81736c;--wine:#894f50;--cream:#faf7f1;--paper:#fffdf9;--line:#e9dfd6}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}.wrap{width:min(100% - 36px,980px);margin:auto}.top{padding:20px 0;border-bottom:1px solid var(--line)}a{color:var(--wine);text-decoration:none}.brand{font:italic 22px Georgia,serif}.main{padding:48px 0}.card{max-width:520px;margin:0 auto;background:var(--paper);border:1px solid var(--line);padding:28px;box-shadow:0 16px 40px #5943390c}h1{font:400 34px Georgia,serif;margin:0 0 10px;color:var(--wine)}p{color:var(--muted);font-size:14px;line-height:1.6}.form{display:grid;gap:12px;margin-top:20px}label{font-size:13px;font-weight:bold}input,button{font:inherit}input[type=email],input[type=file]{border:1px solid var(--line);background:white;padding:13px;border-radius:4px;width:100%}.btn{border:0;border-radius:99px;background:var(--wine);color:white;padding:13px 20px;cursor:pointer;font-weight:bold}.btn:hover{background:#713e40}.status{min-height:22px;color:var(--wine);font-size:13px}.admin{display:none}.admin.on{display:block}.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:25px 0}.bar h2{font:400 26px Georgia,serif}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.photo{position:relative;aspect-ratio:1;background:#eee5dc;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.photo button{position:absolute;right:8px;top:8px;border:0;border-radius:99px;background:#fff;color:var(--wine);padding:8px 12px;cursor:pointer}.empty{font:italic 16px Georgia,serif;color:#9a8b81}@media(max-width:620px){.main{padding:30px 0}.card{padding:22px 18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.bar{align-items:flex-start;flex-direction:column}.bar .btn{width:100%}}</style></head><body><header class="top"><div class="wrap"><a class="brand" href="./">Ngày vui ✳</a></div></header><main class="wrap main"><section class="card" id="login"><h1>Quản trị album</h1><p>Nhập email quản trị. Supabase sẽ gửi link đăng nhập một lần đến hộp thư của anh.</p><form class="form" id="loginForm"><label for="email">Email quản trị</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="Email đã được cấp quyền"><button class="btn" type="submit">Gửi link đăng nhập</button><div class="status" id="loginStatus" aria-live="polite"></div></form></section><section class="admin" id="admin"><div class="bar"><div><h1>Album của anh</h1><p>Chỉ tài khoản quản trị được tải hoặc xóa ảnh.</p></div><button class="btn" id="signOut" type="button">Đăng xuất</button></div><form class="form" id="uploadForm"><label for="photos">Chọn ảnh (tối đa 15 MB mỗi ảnh)</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple required><button class="btn" type="submit">Tải ảnh lên album</button><div class="status" id="uploadStatus" aria-live="polite"></div></form><div class="grid" id="photoGrid"></div><p class="empty" id="empty">Album chưa có ảnh.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.80.0/dist/umd/supabase.min.js"></script><script>
const SUPABASE_URL='https://pghwcnwybwesvueasteu.supabase.co',SUPABASE_PUBLISHABLE_KEY='sb_publishable_kWQMOn2tJzcHCNDYdWSePw_KVYucYEY',ADMIN_EMAIL='luan1980tl@gmail.com';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});const login=document.getElementById('login'),admin=document.getElementById('admin'),loginStatus=document.getElementById('loginStatus'),uploadStatus=document.getElementById('uploadStatus'),grid=document.getElementById('photoGrid'),empty=document.getElementById('empty');function showSignedIn(user){if(!user||user.email?.toLowerCase()!==ADMIN_EMAIL){admin.classList.remove('on');login.style.display='block';if(user)sb.auth.signOut();return}login.style.display='none';admin.classList.add('on');loadPhotos()}sb.auth.getSession().then(({data})=>showSignedIn(data.session?.user));sb.auth.onAuthStateChange((_event,session)=>showSignedIn(session?.user));document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim().toLowerCase();if(email!==ADMIN_EMAIL){loginStatus.textContent='Email này chưa được cấp quyền quản trị.';return}loginStatus.textContent='Đang gửi link đăng nhập…';const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:true}});loginStatus.textContent=error?'Chưa gửi được link. Vui lòng thử lại.':'Đã gửi link đăng nhập đến email của anh. Mở thư và bấm vào link để tiếp tục.'});document.getElementById('signOut').addEventListener('click',async()=>{await sb.auth.signOut();location.reload()});function publicUrl(path){return sb.storage.from('wedding-album').getPublicUrl(path).data.publicUrl}async function loadPhotos(){const{data,error}=await sb.from('album_photos').select('id,path,name,created_at').order('created_at',{ascending:false});if(error){uploadStatus.textContent='Không tải được album. Vui lòng đăng nhập lại.';return}grid.replaceChildren();empty.hidden=!!data?.length;(data||[]).forEach(photo=>{const card=document.createElement('article'),img=document.createElement('img'),del=document.createElement('button');card.className='photo';img.src=publicUrl(photo.path);img.alt=photo.name;del.type='button';del.textContent='Xóa';del.addEventListener('click',async()=>{if(!confirm('Xóa ảnh này khỏi album?'))return;const{error:fileError}=await sb.storage.from('wedding-album').remove([photo.path]);if(fileError){uploadStatus.textContent='Không xóa được ảnh.';return}const{error:rowError}=await sb.from('album_photos').delete().eq('id',photo.id);if(rowError){uploadStatus.textContent='Ảnh đã xóa khỏi kho nhưng chưa cập nhật danh sách.';return}loadPhotos()});card.append(img,del);grid.append(card)})}document.getElementById('uploadForm').addEventListener('submit',async e=>{e.preventDefault();const files=[...document.getElementById('photos').files];if(!files.length)return;for(const file of files){if(!file.type.startsWith('image/'))continue;if(file.size>15*1024*1024){uploadStatus.textContent='Ảnh “'+file.name+'” vượt quá 15 MB.';continue}uploadStatus.textContent='Đang tải '+file.name+'…';const path=crypto.randomUUID()+'-'+file.name.replace(/[^\w.-]/g,'_'),{error:uploadError}=await sb.storage.from('wedding-album').upload(path,file,{contentType:file.type,upsert:false});if(uploadError){uploadStatus.textContent='Tải ảnh chưa thành công. Vui lòng đăng nhập lại.';return}const{error:rowError}=await sb.from('album_photos').insert({path,name:file.name});if(rowError){await sb.storage.from('wedding-album').remove([path]);uploadStatus.textContent='Không cập nhật được danh sách ảnh.';return}}document.getElementById('uploadForm').reset();uploadStatus.textContent='Đã cập nhật album.';loadPhotos()});
</script></body></html>
